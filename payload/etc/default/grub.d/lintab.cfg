# LintabOS GRUB defaults (sourced by update-grub after /etc/default/grub).
GRUB_DISTRIBUTOR="LintabOS"
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=false
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_THEME=/usr/share/grub/themes/lintabos/theme.txt
# The Windows entry comes from 11_lintab_windows; os-prober would add a duplicate.
GRUB_DISABLE_OS_PROBER=true
