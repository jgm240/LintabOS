# LintabOS updater settings (edit freely; the package keeps your changes).
#
# channel:    "any"    = offer every release, including pre-releases (default while LintabOS is young)
#             "stable" = offer only full releases
# auto_check: "true"   = once a day, ask GitHub (api.github.com) whether a newer release exists and show a
#                        notification. Nothing is downloaded or installed without you choosing "Update now".
#             "false"  = never contact GitHub unless you open the updater and press "Check again".
channel = any
auto_check = true
