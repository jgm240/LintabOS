set default=0
set timeout=8

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

# Big fonts for the 2000x1200 panel
loadfont /boot/grub/dejavu_regular_28.pf2
loadfont /boot/grub/dejavu_bold_28.pf2
loadfont /boot/grub/dejavu_bold_40.pf2

source /boot/grub/theme.cfg

terminal_output gfxterm
